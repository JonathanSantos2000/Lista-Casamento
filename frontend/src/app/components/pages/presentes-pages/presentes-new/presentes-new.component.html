<div class="conteinner__register">
  <div class="photospace"></div>
  <div class="us_photo">
    <img
      id="bg_aquarela"
      src="assets/images/bg-aquarela.png"
      alt="Foto Nossa"
    />
    <img id="eu_ela" src="assets/images/eu_ela.png" alt="Foto Nossa" />
  </div>
  <div class="form"></div>
  <form [formGroup]="furnituresForm" (ngSubmit)="submit()">
    <div class="title_logo">
      <div class="separador_flor">
        <img src="assets/images/flor.png" alt="Minha Foto" />
      </div>
      <h3>Cadastro de Presentes.</h3>
    </div>
    <!-- Nome -->
    <text-input
      [control]="fc['FurNom']"
      [showErrorWhen]="isSubmitted"
      type="text"
      label="Nome Produto:"
      exibir_label="0"
    ></text-input>

    <!-- email -->
    <text-input
      [control]="fc['FurVlrIte']"
      [showErrorWhen]="isSubmitted"
      type="number"
      label="VALOR DO PRODUTO R$:"
      exibir_label="0"
    ></text-input>

    <!-- Comodos -->

    <div class="select">
      <label>Selecione o Cômodo:</label><br />
      <div class="search">
        <text-input
          [control]="fc['FurRoomsSearch']"
          [showErrorWhen]="isSubmitted"
          type="text"
          label="Nome do Cômodo:"
          exibir_label="0"
        ></text-input>

        <button type="button" (click)="buscarItensPorNome()">
          <i class="bi bi-search"></i>
        </button>
      </div>

      <select formControlName="FurRooms" (change)="onRoomSelect($event)">
        <option value="">Selecione o Cômodo</option>
        @for (room of roomsFiltered; track room.RooNom) {
        <option [value]="room.RooNom">
          {{ room.RooNom }}
        </option>
        }
      </select>
    </div>
    <div class="btns">
      <button type="submit">Criar</button>
    </div>
  </form>
</div>
